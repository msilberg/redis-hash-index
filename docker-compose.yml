services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  benchmark:
    build:
      context: .
      dockerfile: services/benchmark/Dockerfile
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      SEED_KEYS: "${SEED_KEYS:-2000000}"
      SEED_VALUE: "${SEED_VALUE:-1}"
      SEED_MODE: "${SEED_MODE:-bulk}"
      LAZY_CONCURRENCY: "${LAZY_CONCURRENCY:-16}"
      LAZY_MAX_KEYS: "${LAZY_MAX_KEYS:-50000}"
      LAZY_WARM_USERS: "${LAZY_WARM_USERS:-1000}"
      # Lazy fills go benchmark -> test-api -> mock-billing; mock-billing's SEED_VALUE is checked first.
      TEST_API_URL: http://test-api:3001
      MOCK_BILLING_URL: http://mock-billing:3003
      WEBHOOK_URL: http://webhook:3002
    depends_on:
      redis:
        condition: service_healthy
      test-api:
        condition: service_healthy
      mock-billing:
        condition: service_healthy
      webhook:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-api:
    build:
      context: .
      dockerfile: services/test-api/Dockerfile
    ports: ["3001:3001"]
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      # The origin behind GET /subscription, one network hop away.
      MOCK_BILLING_URL: http://mock-billing:3003
      BILLING_TIMEOUT_MS: "${BILLING_TIMEOUT_MS:-5000}"
    depends_on:
      redis:
        condition: service_healthy
      mock-billing:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The fake third party ("Chargebee"). No Redis, no dependencies. SEED_VALUE must match benchmark's.
  mock-billing:
    build:
      context: .
      dockerfile: services/mock-billing/Dockerfile
    ports: ["3003:3003"]
    environment:
      PORT: "3003"
      SEED_VALUE: "${SEED_VALUE:-1}"
      ORIGIN_LATENCY_MS: "${ORIGIN_LATENCY_MS:-0}"
      ORIGIN_FAIL_USER: "${ORIGIN_FAIL_USER:-}"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  webhook:
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
    ports: ["3002:3002"]
    environment:
      PORT: "3002"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
